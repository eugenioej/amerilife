# Daily pull of brokerage Sales Leaderboard CSVs from AmeriLife outbound SFTP.
# Updates are usually weekly; the job is idempotent and exits cleanly when nothing changed.
#
# Required repo secrets:
#   LEADERBOARD_SFTP_USER
#   LEADERBOARD_SFTP_PASSWORD
#
# Optional secrets / vars:
#   LEADERBOARD_SFTP_HOST (default sftp.amerilife.com)
#   LEADERBOARD_SFTP_PORT (default 22)
#   LEADERBOARD_SFTP_REMOTE_DIR (default /outbound)

name: Sync leaderboard SFTP

on:
  schedule:
    # 15:30 UTC ≈ 10:30 America/Denver (files historically land ~15:00 UTC)
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: sync-leaderboard-sftp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull outbound CSVs
        env:
          # Optional overrides; script defaults to sftp.amerilife.com:22 /outbound
          LEADERBOARD_SFTP_HOST: ${{ secrets.LEADERBOARD_SFTP_HOST }}
          LEADERBOARD_SFTP_PORT: ${{ secrets.LEADERBOARD_SFTP_PORT }}
          LEADERBOARD_SFTP_USER: ${{ secrets.LEADERBOARD_SFTP_USER }}
          LEADERBOARD_SFTP_PASSWORD: ${{ secrets.LEADERBOARD_SFTP_PASSWORD }}
          LEADERBOARD_SFTP_REMOTE_DIR: ${{ secrets.LEADERBOARD_SFTP_REMOTE_DIR }}
        run: pnpm sync:leaderboard-sftp

      - name: Upload archive artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-sftp-${{ github.run_id }}
          path: frontend/.cache/leaderboard-sftp
          if-no-files-found: warn
          retention-days: 30
