# Daily pull of brokerage Sales Leaderboard CSVs from AmeriLife outbound SFTP,
# then import latest/tables.json into the headless WordPress leaderboard CPT.
# Updates are usually weekly; the job is idempotent and exits cleanly when nothing changed.
#
# Required repo secrets:
#   LEADERBOARD_SFTP_USER
#   LEADERBOARD_SFTP_PASSWORD
#
# Required for WP import (Editor/Admin Application Password — not mediauploader):
#   WORDPRESS_URL (or NEXT_PUBLIC_WORDPRESS_URL)
#   WORDPRESS_USER (or HEADLESS_WP_APP_USER)
#   WORDPRESS_APP_PASSWORD (or HEADLESS_WP_APP_PASSWORD)
#
# Optional secrets / vars:
#   LEADERBOARD_SFTP_HOST (default sftp.amerilife.com)
#   LEADERBOARD_SFTP_PORT (default 22)
#   LEADERBOARD_SFTP_REMOTE_DIR (default /outbound)

name: Sync leaderboard SFTP

on:
  schedule:
    # 15:30 UTC ≈ 10:30 America/Denver (files historically land ~15:00 UTC)
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: sync-leaderboard-sftp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull outbound CSVs
        env:
          # Optional overrides; script defaults to sftp.amerilife.com:22 /outbound
          LEADERBOARD_SFTP_HOST: ${{ secrets.LEADERBOARD_SFTP_HOST }}
          LEADERBOARD_SFTP_PORT: ${{ secrets.LEADERBOARD_SFTP_PORT }}
          LEADERBOARD_SFTP_USER: ${{ secrets.LEADERBOARD_SFTP_USER }}
          LEADERBOARD_SFTP_PASSWORD: ${{ secrets.LEADERBOARD_SFTP_PASSWORD }}
          LEADERBOARD_SFTP_REMOTE_DIR: ${{ secrets.LEADERBOARD_SFTP_REMOTE_DIR }}
        run: pnpm sync:leaderboard-sftp

      - name: Import tables into WordPress
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.NEXT_PUBLIC_WORDPRESS_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          HEADLESS_WP_APP_USER: ${{ secrets.HEADLESS_WP_APP_USER }}
          HEADLESS_WP_APP_PASSWORD: ${{ secrets.HEADLESS_WP_APP_PASSWORD }}
        run: |
          if [ -z "${WORDPRESS_APP_PASSWORD}${HEADLESS_WP_APP_PASSWORD}" ]; then
            echo "::warning::WP Application Password secret missing — skipping import (SFTP archive still uploaded). Set WORDPRESS_APP_PASSWORD (Editor/Admin) to enable."
            exit 0
          fi
          pnpm import:leaderboard -- --require-creds

      - name: Upload archive artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-sftp-${{ github.run_id }}
          path: frontend/.cache/leaderboard-sftp
          if-no-files-found: warn
          retention-days: 30
